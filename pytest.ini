[pytest]
asyncio_mode = auto
# storage 层在 import 时创建模块级 asyncio.Lock；若每个测试各自使用独立事件循环
# （function 作用域），该锁会绑定到首个循环，后续测试在新循环中获取时触发
# "Lock is bound to a different event loop"。改为 session 作用域，全程共用一个循环。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider
